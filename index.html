<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./src/main.ts" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div id="title-bar">
        <h1 id="web-title">Where in the World?</h1>
        <div id="web-preference">
            <img src="./design/assets/dark-mode-icon-light.svg" alt="dark mode moon icon">
            <button id="webPreferenceButtonToggle" alt="dark mode">Dark Mode</div>
        </div>
    </div>
    <hr>
    
    <div id="countrySearchContainer">
        <div id="searchContainer">
            <img src="./design/assets/search-light-icon.svg" id= "searchIcon" alt=" light mode magnifying glass">
            <input type="text" id="countryInput" placeholder="Search for a country...">
        </div>

        <select name="filterCountries" id="filterByRegionSelect">
              <option value="Label">Filter by Region</option>
              <option value="Africa">Africa</option>
              <option value="America">America</option>
              <option value="Asia">Asia</option>
              <option value="Europe">Europe</option>
              <option value="Oceana">Oceana</option>
        </select>
    </div>

    
    <!---dynamically generate country-->
    <ul id="countryListContainer"></ul>
</body>
</html>
