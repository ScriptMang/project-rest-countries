<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./src/main.ts"></script>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div id="title-bar">
        <h1 id="web-title">Where in the World?</h1>
        <div id="web-preference">
            <img src="./design/assets/light-mode-icon.svg" alt="light mode icon">
            <select name="web-preference" id="web-preference-select">
              <option value="light-mode">Light Mode</option>
              <option value="dark-mode">Dark Mode</option>
            </select>
        </div>
    </div>

    <div id="countrySearchContainer">
        <div id="searchContainer">
            <button id="searchCountryButton">
              <img src="./design/assets/search-light-icon.svg" alt=" light mode magnifying glass">
              <input type="text" id="countryInput" placeholder="search for a country...">
            </button>
           
        </div>

        <select name="filterCountries" id="filterCountriesSelect">
              <option value="Region">Region</option>
              <option value="Africa">Africa</option>
              <option value="America">America</option>
              <option value="Asia">Asia</option>
              <option value="Europe">Europe</option>
              <option value="Oceana">Oceana</option>
        </select>
    </div>

    
    <!---dynamically generate country-->
    <ul id="countryListContainer"></ul>
</body>
</html>
