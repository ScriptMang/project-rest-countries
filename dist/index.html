<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="/countries-rest-api.0f289648.js" defer=""></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/countries-rest-api.0243a6ab.css">
</head>
<body>
    <div id="title-bar">
        <h1 id="web-title">Where in the World?</h1>
        <div id="web-preference">
            <img src="/dark-mode-icon-light.a3b359e4.svg" alt="dark mode moon icon">
            <button id="webPreferenceButtonToggle" alt="dark mode">Dark Mode</button></div>
        </div>
    
    <hr>
    
    <div id="countrySearchContainer">
        <div id="searchContainer">
            <img src="/search-light-icon.e30b5ccf.svg" id="searchIcon" alt=" light mode magnifying glass">
            <input type="text" id="countryInput" placeholder="Search for a country...">
        </div>

        <select name="filterByRegion" id="filterByRegionSelect">
              <option value="Label">Filter by Region</option>
              <option value="Africa">Africa</option>
              <option value="Americas">Americas</option>
              <option value="Asia">Asia</option>
              <option value="Europe">Europe</option>
              <option value="Oceania">Oceania</option>
        </select>
    </div>

    
    <!---dynamically generate country-->
    <ul id="countryListContainer"></ul>

</body></html>
